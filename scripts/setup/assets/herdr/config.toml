onboarding = false
[theme]
name = "nord"

[ui]
status_indicators = "symbols"

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", bold = true }, "git_status"],
]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", bold = true }],
  ["$limit"],
  ["$cache_high", { token = "$cache_mid", fg = "#e0af68" }, { token = "$cache_low", fg = "#f7768e" }],
  ["$context"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", bold = true }],
  [{ token = "terminal_title_stripped", bold = true }],
  ["$limit"],
  ["$cache_high", { token = "$cache_mid", fg = "#e0af68" }, { token = "$cache_low", fg = "#f7768e" }],
  ["$context"],
]

pi = [
  ["state_icon", { token = "agent", bold = true }],
  ["$summary"],
  ["$cache_high", { token = "$cache_mid", fg = "#e0af68" }, { token = "$cache_low", fg = "#f7768e" }],
  ["$context"],
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

[terminal]
new_cwd = "current"
